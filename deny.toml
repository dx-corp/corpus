[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Each entry names the dependency path that keeps the advisory and what removes it.
# Advisories a lockfile update could clear (h2, webpki-roots, tokio) were cleared
# that way; delete each remaining entry as its crate moves.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is unmaintained in products/corpus through corpus-agent -> chrono, sqlx-core -> chrono, yara-x-proto -> chrono. RustSec reports all versions affected with no patched release; a version bump cannot remove this maintenance advisory. Replacing these timestamp bindings requires compatibility verification for serialization, scheduling and storage before removal; track the migration at https://github.com/dx-corp/mono/issues/23895. This accepts only the maintenance advisory and makes no claim about untrusted input safety. Remove after migration or re-review at expiry. Reviewed on 2026-11-25 against the workspace lockfile and current RustSec record. expires: 2026-12-02" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 is unmaintained, reached only through serde_yaml 0.9.34+deprecated, a direct dependency of corpus-agent. RustSec lists no patched release, so no lockfile update removes it; replacing serde_yaml in corpus-agent clears it. Re-reviewed 2026-11-25 against products/corpus/Cargo.lock. expires: 2026-12-09" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained and is a direct dependency of corpus-core. RustSec lists no patched release; moving corpus-core to the PEM parser in rustls-pki-types clears it. Re-reviewed 2026-11-25 against products/corpus/Cargo.lock. expires: 2026-12-09" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 is unmaintained, reached only through yara-x 1.23.0 in corpus-core. RustSec lists no patched release and yara-x still requires bincode ^2 (see products/deixic-endpoint/deny.toml), so no upgrade removes it. Re-reviewed 2026-11-25 against products/corpus/Cargo.lock. expires: 2026-12-09" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 through rusqlite 0.32.1 (corpus-agent) and sqlx-sqlite 0.8.6. The patched line is 0.39, which needs a rusqlite and sqlx major upgrade, not a lockfile update. Re-reviewed 2026-11-25 against products/corpus/Cargo.lock. expires: 2026-12-09" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Embedding Maestro brings its existing dirs -> dirs-sys -> option-ext edge
# into Platform. products/maestro/deny.toml allows MPL-2.0. Scope the Platform
# exception to the option-ext version pinned in rust/Cargo.lock.
exceptions = [
    { crate = "option-ext@=0.2.0", allow = ["MPL-2.0"] },
    # Pinned SMTP encoding dependency; other crates and versions remain gated.
    { crate = "quoted_printable@=0.5.2", allow = ["0BSD"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# cargo-deny currently reports internal `workspace = true` crates as wildcard
# dependencies. Keep the check runnable until those workspace inheritance specs
# are normalized or cargo-deny distinguishes them from external `*` specs.
#
# See `cargo deny check bans`; switching this to `deny` currently flags
# platform-core, platform-core-types, and platform-proto workspace references.
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "native-tls", reason = "Prefer rustls-backed TLS in Rust services unless explicitly reviewed." },
    { crate = "openssl", reason = "Prefer rustls-backed TLS in Rust services unless explicitly reviewed." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
