[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Embedding Maestro brings its existing dirs -> dirs-sys -> option-ext edge
# into Platform. products/maestro/deny.toml allows MPL-2.0. Scope the Platform
# exception to the option-ext version pinned in rust/Cargo.lock.
exceptions = [
    { crate = "option-ext@=0.2.0", allow = ["MPL-2.0"] },
    # Pinned SMTP encoding dependency; other crates and versions remain gated.
    { crate = "quoted_printable@=0.5.2", allow = ["0BSD"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# cargo-deny currently reports internal `workspace = true` crates as wildcard
# dependencies. Keep the check runnable until those workspace inheritance specs
# are normalized or cargo-deny distinguishes them from external `*` specs.
#
# See `cargo deny check bans`; switching this to `deny` currently flags
# platform-core, platform-core-types, and platform-proto workspace references.
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "native-tls", reason = "Prefer rustls-backed TLS in Rust services unless explicitly reviewed." },
    { crate = "openssl", reason = "Prefer rustls-backed TLS in Rust services unless explicitly reviewed." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
